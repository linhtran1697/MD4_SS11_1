spring.application.name=hrm-employee-security
server.port=8080

# Demo credentials for this exercise. Override with environment variables when needed.
app.security.admin-password=${ADMIN_PASSWORD:Admin123!}

# Demo key only. Override JWT_SECRET with a private, random value outside this exercise.
# HS256 requires at least 32 bytes; this application checks the configured length.
jwt.secret=${JWT_SECRET:hrm-session-11-demo-key-only-change-before-deployment-2026}
# Milliseconds: 24 * 60 * 60 * 1000 = one day.
jwt.expiration=${JWT_EXPIRATION:86400000}
